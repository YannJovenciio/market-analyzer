[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-analyzer"
version = "0.1.0"
description = "Modular market analysis and backtesting toolkit"
requires-python = ">=3.10"
dependencies = [
    "imageio-ffmpeg>=0.6",
    "numpy>=2.0",
    "Pillow>=10.0",
    "pytesseract>=0.3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.17",
]

[project.scripts]
market-analyzer = "market_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff.lint]
# Conjunto padrao do ruff (E4, E7, E9, F) + a regra exigida pelo Requisito 7.
select = ["E4", "E7", "E9", "F", "UP032"]
