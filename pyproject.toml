[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-analyzer"
version = "0.1.0"
description = "Modular market analysis and backtesting toolkit"
requires-python = ">=3.10"
dependencies = [
    "imageio-ffmpeg>=0.6",
    "numpy>=2.0",
    "Pillow>=10.0",
    "pytesseract>=0.3.13",
]

[project.scripts]
market-analyzer = "market_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

